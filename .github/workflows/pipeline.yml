name: media-pipeline

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip upload"
        type: boolean
        default: false

concurrency:
  group: media-pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg + fallback font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          ffmpeg -version | head -1

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache downloaded assets
        uses: actions/cache@v4
        with:
          path: work/cache
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS_B64: ${{ secrets.YOUTUBE_CREDENTIALS_B64 }}
          TARGET_DURATION_SEC: "600"
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: work/out/final.mp4
          retention-days: 7
          if-no-files-found: warn
